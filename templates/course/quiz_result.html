{% extends 'course/courseDetails.html' %}
{% load static %}

{% block title %}
  <title>Quiz Result</title>
{% endblock %}

{% block course_content %}
<div class="w-3/4 mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
  <h1 class="text-3xl font-bold text-center text-blue-600 mb-4">Quiz Result</h1>
  
  <div class="text-center text-2xl font-semibold text-gray-800 mb-6">
    Your Score: {{ score }}
  </div>
  
  <div class="flex justify-center">
    <a href="{% url 'courses:quizes' pk=course.pk %}">
      <button class="bg-gradient-to-r from-purple-500 via-pink-500 to-red-500 text-white font-semibold py-2 px-6 rounded-full shadow-md hover:shadow-lg transition duration-300 transform hover:scale-105">
        Go to Quiz Section
      </button>
    </a>
  </div>
</div>
{% endblock %}
